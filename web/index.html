<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jealousfin Web — Live TV on your LAN.">
  <meta name="theme-color" content="#5254CF">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jealouswin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jealousfin Web</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="hls.min.js"></script>
  <script src="assets/jealouswin/rtc.js"></script>
  <script src="player.js"></script>
  <script>
    // Retire only the legacy Flutter offline worker and its named caches.
    // A controlled document needs one navigation before the worker releases it.
    (async () => {
      const release = '__JEALOUSWIN_RELEASE__';
      try {
        if ('serviceWorker' in navigator) {
          const worker = navigator.serviceWorker.controller;
          const legacy = registration => [registration.active, registration.waiting, registration.installing]
            .some(w => w && new URL(w.scriptURL).pathname === '/flutter_service_worker.js');
          const registrations = await navigator.serviceWorker.getRegistrations();
          const owned = registrations.filter(legacy);
          await Promise.all(owned.map(r => r.unregister()));
          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names.filter(n => ['flutter-app-cache','flutter-temp-cache','flutter-app-manifest'].includes(n)).map(n => caches.delete(n)));
          }
          if (worker && new URL(worker.scriptURL).pathname === '/flutter_service_worker.js' &&
              sessionStorage.getItem('jw-cache-retired') !== release) {
            sessionStorage.setItem('jw-cache-retired', release);
            const url = new URL(location.href);
            url.searchParams.set('release', release);
            location.replace(url.href);
            return;
          }
        }
      } catch (_) {
        // Private browsing or storage restrictions must not prevent startup.
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?release=' + encodeURIComponent(release);
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
